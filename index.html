<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunch Lane – Home Tiffin Service</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#202124;--muted:#5f6368;--line:#dadce0;--blue:#1a73e8;--blue-bg:#e8f0fe;--soft:#f8f9fa;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#202124;--card:#292a2d;--ink:#e8eaed;--muted:#9aa0a6;--line:#3c4043;--blue:#8ab4f8;--blue-bg:#394457;--soft:#2d2e31;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line);padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5}
header .wrap{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:500}
.logo span{color:var(--blue)}
nav a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:16px}
.top{padding:36px 0 28px}
h1{font-size:30px;font-weight:400;margin:0 0 8px}
.top p{color:var(--muted);margin:0 0 20px}
h2{font-size:22px;font-weight:400;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
section{padding:28px 0;border-top:1px solid var(--line)}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:4px;padding:10px 24px;font:500 14px Roboto,Arial,sans-serif;text-decoration:none;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#202124}}
.btn:disabled{opacity:.6}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:6px 14px;font:14px Roboto,Arial,sans-serif;cursor:pointer}
.tab[aria-selected="true"]{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bg);font-weight:500}
.card{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:16px}
.card h3{font-size:16px;font-weight:500;margin:0 0 6px}
.card ul{margin:0;padding-left:18px;color:var(--muted)}
.today{display:none;color:var(--blue);font-size:12px;font-weight:500;margin-bottom:4px}
.plans{display:grid;gap:8px}
.plan{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.plan small{display:block;color:var(--muted);font-size:13px}
.price{font-size:18px;color:var(--ink);font-weight:500}
form{display:grid;gap:14px}
label{font-size:13px;color:var(--muted);display:grid;gap:4px}
input,select{font:16px Roboto,Arial,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid var(--blue);border-color:var(--blue)}
#msg{color:var(--ink);margin-top:12px}
#wa{margin-top:8px;background:var(--blue-bg);color:var(--blue)}
footer{border-top:1px solid var(--line);background:var(--soft);padding:20px 0;color:var(--muted);font-size:13px}
html{scroll-behavior:smooth}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo" id="logo"></div><nav><a href="#menu">Menu</a><a href="#plans">Plans</a><a href="#order">Order</a></nav></div></header>
<main class="wrap">
<div class="top"><h1 id="tag"></h1><p id="about"></p><a class="btn" href="#order">Order now</a></div>
<section id="menu"><h2>Menu</h2><p class="sub" id="menunote"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="card" id="thali" role="tabpanel" aria-live="polite"></div></section>
<section id="plans"><h2>Plans and prices</h2><div class="plans" id="planlist"></div></section>
<section id="order"><h2>Place your order</h2><p class="sub">We receive your order instantly. No signup needed.</p>
  <form id="f">
    <label>Your name<input id="n" required autocomplete="name"></label>
    <label>Plan<select id="p"></select></label>
    <label>Delivery address<input id="a" required autocomplete="street-address"></label>
    <div><button class="btn" type="submit">Place order</button></div>
  </form>
  <p id="msg" role="status"></p>
  <a id="wa" class="btn" style="display:none" href="#">Also confirm by email</a></section>
<section id="visit"><h2>Find us</h2><p class="sub" id="visitinfo"></p></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<script>
var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function $(i){return document.getElementById(i)}
fetch("shop.json?v="+Date.now()).then(function(r){return r.json()}).then(init).catch(function(){
  $("tag").textContent="Page is loading";$("about").textContent="Please refresh. If this stays, the shop details file is missing.";
});
function init(c){
  document.title=c.name+" – Home Tiffin Service";
  var parts=c.name.split(" ");var last=parts.pop();
  $("logo").textContent=parts.join(" ")+" ";var sp=document.createElement("span");sp.textContent=last;$("logo").appendChild(sp);
  $("tag").textContent=c.tagline;$("about").textContent=c.about;
  $("visitinfo").textContent=c.address+" · "+c.hours;
  $("foot").textContent="© 2026 "+c.name;
  $("menunote").textContent=c.menuNote||"";
  var names=Object.keys(c.menu||{}),tabs=$("tabs"),thali=$("thali");
  var today=days[new Date().getDay()];
  function show(d){
    Array.prototype.forEach.call(tabs.children,function(b){b.setAttribute("aria-selected",b.textContent===d?"true":"false")});
    thali.textContent="";
    if(d===today){var t=document.createElement("div");t.className="today";t.style.display="block";t.textContent="TODAY";thali.appendChild(t)}
    var h=document.createElement("h3");h.textContent=d;thali.appendChild(h);
    var u=document.createElement("ul");c.menu[d].forEach(function(i){var l=document.createElement("li");l.textContent=i;u.appendChild(l)});thali.appendChild(u);
  }
  if(!names.length){thali.textContent="Menu coming soon. Please contact us for today’s food."}
  else{names.forEach(function(d){var b=document.createElement("button");b.className="tab";b.type="button";b.setAttribute("role","tab");b.textContent=d;b.onclick=function(){show(d)};tabs.appendChild(b)});show(names.indexOf(today)>-1?today:names[0])}
  c.plans.forEach(function(p){
    var row=document.createElement("div");row.className="plan";
    var l=document.createElement("div");l.textContent=p.name;var s=document.createElement("small");s.textContent=p.note||"";l.appendChild(s);
    var pr=document.createElement("div");pr.className="price";pr.textContent=p.price;row.appendChild(l);row.appendChild(pr);$("planlist").appendChild(row);
    var o=document.createElement("option");o.textContent=p.name+" ("+p.price+")";$("p").appendChild(o);
  });
  $("f").addEventListener("submit",function(e){
    e.preventDefault();
    var btn=e.target.querySelector("button"),msg=$("msg");
    var n=$("n").value,p=$("p").value,a=$("a").value;
    btn.disabled=true;btn.textContent="Sending...";
    var body=new URLSearchParams({name:n,plan:p,address:a});
    fetch(c.orderWebhook,{method:"POST",mode:"no-cors",body:body}).then(function(){
      msg.textContent="Thank you, "+n+". Your order is received. We will call you soon.";e.target.reset();
    }).catch(function(){msg.textContent="Could not send. Please use the email button below."}).then(function(){
      btn.disabled=false;btn.textContent="Place order";
      var t="Hi, I would like to order a tiffin.\nName: "+n+"\nPlan: "+p+"\nAddress: "+a;
      $("wa").href="mailto:"+c.email+"?subject="+encodeURIComponent("New order: "+n)+"&body="+encodeURIComponent(t);
      $("wa").style.display="inline-block";
    });
  });
}
</script>
</body>
</html>
